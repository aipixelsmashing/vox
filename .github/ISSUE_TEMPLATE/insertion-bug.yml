name: Text didn't appear in an app
description: Dictation worked but the text didn't land in the field
labels: ["insertion"]
body:
  - type: markdown
    attributes:
      value: |
        The method trace is the useful part of this report. Find it in
        Settings → Diagnostics, or open the history entry for the failed dictation and choose
        "Copy details".
  - type: input
    id: app
    attributes:
      label: Which application
      placeholder: "Slack 4.41, VS Code 1.99, Windows Terminal 1.21…"
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, "Linux (X11)", "Linux (Wayland)"]
    validations: { required: true }
  - type: input
    id: os_version
    attributes:
      label: OS version, and compositor if Linux
    validations: { required: true }
  - type: textarea
    id: trace
    attributes:
      label: Diagnostics
      description: Paste the copied details. Remove the transcript text if it's sensitive.
      render: text
    validations: { required: true }
  - type: textarea
    id: what_happened
    attributes:
      label: What happened instead
      placeholder: "Nothing appeared. / Text went to the previous window. / Old clipboard was pasted."
    validations: { required: true }
