name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libudev-dev patchelf

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          # Updater manifest signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarisation
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          CI: true
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vox ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md. Verify checksums before installing."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          args: ${{ matrix.args }}

  # Windows Authenticode signing runs as a separate approval-gated job so signing material is
  # never exposed to the build job. See CODE_SIGNING_POLICY.md.
  sign-windows:
    needs: build
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - name: Submit Windows artefacts to SignPath
        run: echo "Configure SignPath action here once the project is enrolled."

  checksums:
    needs: [build, sign-windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - name: Publish SHA-256 sums and minisign signatures
        run: echo "Generate SHA256SUMS, sign detached, attach to the draft release."
