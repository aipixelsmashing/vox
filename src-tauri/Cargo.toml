[package]
name = "vox"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Local push-to-talk dictation that types into whatever field you're in"
license = "Apache-2.0"
repository = "https://github.com/aipixelsmashing/vox"

[lib]
name = "vox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ---- shell ----------------------------------------------------------------
# macos-private-api: a transparent, frameless panel window with its own rounded corners.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

# ---- core -----------------------------------------------------------------
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# ---- hotkey ---------------------------------------------------------------
# See docs/adr/0003. Raw key down/up with left/right modifier fidelity, which is
# what "hold the RIGHT option key" requires and what global-hotkey cannot express.
# keytap only checks Input Monitoring; permissions.rs requests it (docs/PERMISSIONS.md).
keytap = "0.4"

# ---- audio ----------------------------------------------------------------
cpal = "0.15"
ringbuf = "0.5"
rubato = "0.16"
hound = "3"                       # fixtures and debug capture only
# Silero VAD (voice_activity_detector) needs the ONNX runtime, which v1 does not ship
# (ROADMAP.md, "The one decision S3 gates"). v1 trims and rejects with an energy gate in
# audio.rs; Silero returns with Parakeet in M8.

# ---- speech ---------------------------------------------------------------
# v1: Apple SpeechAnalyzer through swift/SpeechAnalyzerBridge.swift, compiled by build.rs.
# SpeechAnalyzer is Swift-only; objc2-speech cannot reach it (docs/spikes/s3-engine.md).
# parakeet-rs and whisper-rs are M8 (docs/adr/0016) and deliberately absent.

# ---- storage --------------------------------------------------------------
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# Accessibility insertion and read-back. Compiles its own Swift bridge; see build.rs for the
# Command Line Tools link-path fix (docs/spikes/s2-injection.md).
axuielement = "0.9"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSData", "NSEnumerator", "NSURL"] }
# NSPasteboard direct (concealed type, changeCount, multi-item snapshot) and NSWorkspace.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace", "NSWindow", "NSResponder"] }
# Synthesised Cmd+V and Unicode key events, and the active tap that swallows the cancel key
# while a dictation is in progress (docs/HOTKEYS.md, problem 4).
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFMachPort", "CFRunLoop"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# M8. Delayed-render clipboard, private clipboard formats, modifier sanitisation and
# UIPI detection. See docs/TEXT-INJECTION.md for why the naive path is unusable.
win-text-inject = "0.1"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_DataExchange",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# M8.
enigo = "0.3"
ashpd = "0.9"                     # XDG portals: RemoteDesktop / libei path on Wayland

[dev-dependencies]
# The mock runtime, so tests/settings_command.rs can drive commands through the real IPC
# argument layer without a webview (docs/TESTING.md, "Command surface").
tauri = { version = "2", features = ["test"] }
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1", features = ["json"] }
proptest = "1"
tempfile = "3"

[features]
default = ["engine-speechanalyzer"]
# Apple SpeechAnalyzer, macOS 26+. No model download, no resident weights of ours.
# Availability is checked at runtime, never assumed at compile time.
engine-speechanalyzer = []
# M8 engines. The modules exist as designed stubs; enabling these without their crates
# does not build, on purpose (docs/adr/0016).
engine-parakeet = []
engine-whisper = []
mock-audio = []                   # replace the microphone with WAV fixtures
mock-inject = []                  # log injections instead of performing them

[[bench]]
name = "pipeline"
harness = false

# Idle RSS, peak RSS and idle CPU over a scripted five-minute run. A >15% idle-RSS regression
# fails a PR exactly like a latency regression. See docs/FOOTPRINT.md.
[[bench]]
name = "footprint"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
